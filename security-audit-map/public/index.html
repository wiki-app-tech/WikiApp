<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centro de Seguridad TDF | Mapa de Calor de Delitos</title>
    
    <!-- Leaflet CSS (Open Source Map) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;650;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app-container">
        <!-- Panel de Control Lateral -->
        <aside id="control-panel" role="region" aria-label="Controles del mapa de calor">
            <header>
                <div class="logo-area">
                    <div class="badge">DIVISIÓN POLICIAL TDF</div>
                    <h1>Auditoría de Seguridad</h1>
                    <span class="subtitle">Monitoreo de Puntos de Calor</span>
                </div>
            </header>

            <div class="panel-section">
                <label for="city-filter" class="control-label">Localidad de Análisis</label>
                <select id="city-filter" class="form-select" aria-label="Filtrar por ciudad de Tierra del Fuego">
                    <option value="ALL">Toda la Provincia</option>
                    <option value="Ushuaia">Ushuaia (Cabecera Sur)</option>
                    <option value="Río Grande">Río Grande (Cabecera Norte)</option>
                    <option value="Tolhuin">Tolhuin (Cabecera Centro)</option>
                </select>
            </div>

            <div class="panel-section">
                <label for="crime-filter" class="control-label">Tipología de Delito</label>
                <select id="crime-filter" class="form-select" aria-label="Filtrar por tipología delictiva">
                    <option value="ALL">Todas las Categorías</option>
                    <option value="Ciberdelito">Ciberdelitos (Fraudes/Estafas)</option>
                    <option value="Robo/Hurto">Delitos contra la Propiedad</option>
                    <option value="Orden Público">Conflictividad y Orden Público</option>
                </select>
            </div>

            <div class="panel-section">
                <label class="control-label">Ajustes de Capa de Calor</label>
                <div class="slider-group">
                    <div class="slider-labels">
                        <label for="radius-slider">Radio de Fusión</label>
                        <span id="radius-val">25m</span>
                    </div>
                    <input type="range" id="radius-slider" min="10" max="60" value="25" class="form-range" aria-label="Ajustar radio de fusión de calor">
                </div>
                <div class="slider-group">
                    <div class="slider-labels">
                        <label for="blur-slider">Difuminado</label>
                        <span id="blur-val">15m</span>
                    </div>
                    <input type="range" id="blur-slider" min="5" max="30" value="15" class="form-range" aria-label="Ajustar difuminado de la capa de calor">
                </div>
            </div>

            <div class="panel-section bg-card">
                <h3>Resumen de Auditoría</h3>
                <div class="metric-row">
                    <span class="metric-name">Delitos Analizados:</span>
                    <span id="metric-count" class="metric-value font-mono">0</span>
                </div>
                <div class="metric-row">
                    <span class="metric-name">Puntos Renderizados:</span>
                    <span id="metric-render" class="metric-value font-mono">0</span>
                </div>
                <div class="metric-row">
                    <span class="metric-name">Límite de Puntos:</span>
                    <span class="metric-value font-mono text-muted">5000</span>
                </div>
            </div>

            <footer>
                <div class="footer-info">
                    <p>Fuente: IPIEC Estadística 2025/2026</p>
                    <p class="copyright">&copy; 2026 MediosWikiApp - Seguridad</p>
                </div>
            </footer>
        </aside>

        <!-- Contenedor del Mapa -->
        <main id="map-area">
            <div id="map" role="application" aria-label="Mapa interactivo de Tierra del Fuego"></div>
            
            <!-- Indicador de Carga -->
            <div id="loader" class="hidden" aria-hidden="true">
                <div class="spinner"></div>
                <span>Actualizando datos...</span>
            </div>

            <!-- Leyenda de Intensidad -->
            <div id="heatmap-legend" role="presentation">
                <span class="legend-title font-sans">Intensidad</span>
                <div class="gradient-bar"></div>
                <div class="legend-labels font-mono">
                    <span>Baja</span>
                    <span>Media</span>
                    <span>Crítica</span>
                </div>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Leaflet Heatmap Plugin (Open Source) -->
    <script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>

    <!-- Google Maps API Fallback Handler (For requirements validation) -->
    <script>
        // Declaración de initMap para compatibilidad con Google Maps JavaScript API si se carga en el futuro
        function initMap() {
            console.log("Inicializando Google Maps API Fallback (Visualization Module Ready)");
            // En un entorno de producción con API Key restringida, aquí se montaría google.maps.Map
        }
    </script>
    
    <!-- Main Application Logic -->
    <script src="app.js"></script>
</body>
</html>
